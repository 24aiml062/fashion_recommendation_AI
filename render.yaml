services:
  - type: web
    name: ai-fashion-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you'll paste this in the Render dashboard
      - key: BASE_URL
        sync: false          # set to your Render service URL after first deploy
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel frontend URL after deploy
